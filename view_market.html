<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Market Mappings</title>
    <link rel="stylesheet" href="style.css">
    <script src="auth.js"></script>
</head>
<body>

    <div id="sidebar-container" data-root="." data-active="markets-management" data-service="sportsbook"></div>
    <script src="sidebar.js"></script>

    <div class="main-content">
        <header class="main-header">
            <h1>Market Mappings Overview</h1>
            <p class="page-subtitle">Review the Hermes markets connected to a provider market.</p>
        </header>

        <main class="split-layout">
            <div class="form-side">
                <div style="margin-bottom: 20px;">
                    <a href="mapping/mapping.html" class="btn-secondary" style="text-decoration: none; display: inline-block;">&larr; Back to mapping</a>
                </div>

                <section class="top-bar" style="display: block; background-color: white; padding: 25px; border-radius: 8px; border: 1px solid #e0e0e0;">
                    <h2 style="margin-bottom: 15px; color: #2c3e50; font-size: 24px;">
                        Provider Market: <span id="displayMarketName" style="color: #007bff;"></span>
                    </h2>
                    <div style="display: flex; gap: 30px; border-top: 1px dashed #ccc; padding-top: 15px;">
                        <p style="font-size: 16px; color: #555;">Market ID: <strong id="displayMarketId" style="color: #333;"></strong></p>
                        <p style="font-size: 16px; color: #555;">Provider: <strong id="displayProvider" style="color: #333;"></strong></p>
                        <p style="font-size: 16px; color: #555;">Sport: <strong id="displaySport" style="color: #333;"></strong></p>
                    </div>
                </section>

                <section class="markets-section" style="margin-top: 25px; padding: 25px; background: white; border-radius: 8px; border: 1px solid #e0e0e0;">
                    <h3 style="margin-bottom: 20px; color: #333; font-size: 18px; border-bottom: 1px solid #eee; padding-bottom: 10px;">Mapped Hermes Markets</h3>
                    
                    <table class="markets-table" style="margin-bottom: 25px;">
                        <thead>
                            <tr>
                                <th>Hermes Market Name</th>
                                <th style="text-align: right;">Action</th>
                            </tr>
                        </thead>
                        <tbody id="mappedMarketsList">
                            </tbody>
                    </table>

                    <div style="text-align: left;">
                        <a href="#" id="addMappingBtn" class="btn-primary" style="text-decoration: none; display: inline-block;">Add new mapping</a>
                    </div>
                </section>
            </div>

        </main>
    </div>

    <script src="pagination.js"></script>
    <script src="./exefeed_markets.js"></script>
    <script src="./market_storage.js"></script>
    <script src="market_details.js"></script>
</body>
</html>
