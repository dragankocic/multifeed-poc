<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Overview</title>
    <link rel="stylesheet" href="../sports/style.css">
    <link rel="stylesheet" href="../style.css">
    <script src="../auth.js"></script>
</head>
<body>

    <div id="sidebar-container" data-root=".." data-active="player-management" data-service="sportsbook"></div>
    <script src="../sidebar.js"></script>

    <div class="main-content">
        <header class="main-header" style="background-color: #17a2b8; color: white;">
            <h1>Player Overview</h1>
            <p class="page-subtitle">Inspect a player and its competitor relationship.</p>
        </header>

        <main class="split-layout">
            <div class="form-side">
                <div style="margin-bottom: 20px;">
                    <a href="player.html" class="btn-secondary" style="text-decoration: none; display: inline-block;">&larr; Back to Players</a>
                </div>

                <section class="top-bar" style="display: block; background-color: white; padding: 25px; border-radius: 8px; border: 1px solid #e0e0e0;">
                    <h2 style="margin-bottom: 15px; color: #2c3e50; font-size: 24px;">
                        Player: <span id="displayPlayerName" style="color: #17a2b8;"></span>
                    </h2>
                    <div style="display: flex; gap: 30px; border-top: 1px dashed #ccc; padding-top: 15px; flex-wrap: wrap;">
                        <p style="font-size: 16px; color: #555;">Player ID: <strong id="displayPlayerId" style="color: #333;"></strong></p>
                        <p style="font-size: 16px; color: #555;">Sport: <strong id="displaySport" style="color: #333;"></strong></p>
                        <p style="font-size: 16px; color: #555;">Competitor: <strong id="displayCompetitor" style="color: #333;"></strong></p>
                    </div>
                </section>

                <section class="markets-section" style="margin-top: 25px; padding: 25px; background: white; border-radius: 8px; border: 1px solid #e0e0e0;">
                    <h3 style="margin-bottom: 20px; color: #333; font-size: 18px; border-bottom: 1px solid #eee; padding-bottom: 10px;">Mapped Provider Players</h3>
                    <p style="margin-bottom: 15px; font-size: 14px; color: #666;">Provider player values currently connected to this internal player.</p>

                    <table class="markets-table" style="margin-bottom: 25px;">
                        <thead>
                            <tr>
                                <th>Provider</th>
                                <th>Provider Player ID</th>
                                <th>Provider Player Name</th>
                                <th style="text-align: right;">Action</th>
                            </tr>
                        </thead>
                        <tbody id="providerPlayersList"></tbody>
                    </table>
                </section>

                <div style="margin-top: 25px;">
                    <a id="editPlayerLink" href="#" class="btn-primary" style="text-decoration: none; display: inline-block;">Edit Player</a>
                </div>
            </div>
        </main>
    </div>

    <script src="../pagination.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const playerId = urlParams.get('id') || '-';
            const playerName = urlParams.get('name') || 'Unknown Player';
            const sportName = urlParams.get('sport') || '-';
            const competitorName = urlParams.get('competitor') || '-';

            document.getElementById('displayPlayerId').textContent = playerId;
            document.getElementById('displayPlayerName').textContent = playerName;
            document.getElementById('displaySport').textContent = sportName;
            document.getElementById('displayCompetitor').textContent = competitorName;
            document.getElementById('editPlayerLink').href = `create_player.html?edit=true&id=${encodeURIComponent(playerId)}&name=${encodeURIComponent(playerName)}&sport=${encodeURIComponent(sportName)}&competitor=${encodeURIComponent(competitorName)}`;

            const providerPlayerMappings = {
                "Mohamed Salah": [
                    { provider: "ExeFeed", providerId: "ply:salah", providerName: "Mohamed Salah" },
                    { provider: "SportRadar", providerId: "sr:player:159665", providerName: "Salah, Mohamed" },
                    { provider: "Bet Genius", providerId: "BG-SALAH", providerName: "M. Salah" }
                ],
                "Virgil van Dijk": [
                    { provider: "ExeFeed", providerId: "ply:van-dijk", providerName: "Virgil van Dijk" },
                    { provider: "SportRadar", providerId: "sr:player:159676", providerName: "Van Dijk, Virgil" },
                    { provider: "LSports", providerId: "LS-VVD", providerName: "V. van Dijk" }
                ],
                "Darwin Nunez": [
                    { provider: "ExeFeed", providerId: "ply:nunez", providerName: "Darwin Nunez" },
                    { provider: "SportRadar", providerId: "sr:player:941807", providerName: "Nunez, Darwin" },
                    { provider: "Bet Construct", providerId: "BC-DN", providerName: "D. Nunez" }
                ],
                "Bukayo Saka": [
                    { provider: "ExeFeed", providerId: "ply:saka", providerName: "Bukayo Saka" },
                    { provider: "SportRadar", providerId: "sr:player:845021", providerName: "Saka, Bukayo" },
                    { provider: "Bet Genius", providerId: "BG-SAKA", providerName: "B. Saka" }
                ],
                "Martin Odegaard": [
                    { provider: "ExeFeed", providerId: "ply:odegaard", providerName: "Martin Odegaard" },
                    { provider: "SportRadar", providerId: "sr:player:351718", providerName: "Odegaard, Martin" },
                    { provider: "LSports", providerId: "LS-MO8", providerName: "M. Odegaard" }
                ],
                "Erling Haaland": [
                    { provider: "ExeFeed", providerId: "ply:haaland", providerName: "Erling Haaland" },
                    { provider: "SportRadar", providerId: "sr:player:839956", providerName: "Haaland, Erling" },
                    { provider: "Bet Genius", providerId: "BG-EH9", providerName: "E. Haaland" }
                ],
                "Kevin De Bruyne": [
                    { provider: "ExeFeed", providerId: "ply:de-bruyne", providerName: "Kevin De Bruyne" },
                    { provider: "SportRadar", providerId: "sr:player:184299", providerName: "De Bruyne, Kevin" },
                    { provider: "Bet Construct", providerId: "BC-KDB", providerName: "K. De Bruyne" }
                ],
                "Jude Bellingham": [
                    { provider: "ExeFeed", providerId: "ply:bellingham", providerName: "Jude Bellingham" },
                    { provider: "SportRadar", providerId: "sr:player:991921", providerName: "Bellingham, Jude" },
                    { provider: "IMG Arena", providerId: "IMG-JB", providerName: "J. Bellingham" }
                ],
                "Vinicius Junior": [
                    { provider: "ExeFeed", providerId: "ply:vinicius", providerName: "Vinicius Junior" },
                    { provider: "SportRadar", providerId: "sr:player:830972", providerName: "Vinicius Junior" },
                    { provider: "LSports", providerId: "LS-VINI", providerName: "Vini Jr." }
                ],
                "Jayson Tatum": [
                    { provider: "ExeFeed", providerId: "ply:tatum", providerName: "Jayson Tatum" },
                    { provider: "SportRadar", providerId: "sr:player:1141190", providerName: "Tatum, Jayson" },
                    { provider: "Bet Genius", providerId: "BG-JT0", providerName: "J. Tatum" }
                ],
                "Jaylen Brown": [
                    { provider: "ExeFeed", providerId: "ply:brown", providerName: "Jaylen Brown" },
                    { provider: "SportRadar", providerId: "sr:player:996297", providerName: "Brown, Jaylen" },
                    { provider: "Bet Construct", providerId: "BC-JB7", providerName: "J. Brown" }
                ]
            };

            const mappedList = providerPlayerMappings[playerName] || [];
            const listContainer = document.getElementById('providerPlayersList');

            if (mappedList.length === 0) {
                listContainer.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #888; font-style: italic;">No provider players mapped to this player yet.</td></tr>';
            } else {
                mappedList.forEach(providerPlayer => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td style="font-weight: 500;">${providerPlayer.provider}</td>
                        <td style="color: #6c757d;">${providerPlayer.providerId}</td>
                        <td style="color: #007bff; font-weight: 500;">${providerPlayer.providerName}</td>
                        <td style="text-align: right;">
                            <button type="button" class="btn-action" style="background-color: #17a2b8; border: none;">Edit Mapping</button>
                        </td>
                    `;
                    listContainer.appendChild(tr);
                });
            }
        });
    </script>
</body>
</html>
