<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Tournament Mapping</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="tournament_mapping_demo.css"><script src="../auth.js"></script><link rel="stylesheet" href="../mapping_workspace.css"></head>
<body class="entity-mapping-page"><div id="sidebar-container" data-root=".." data-active="tournament-management" data-service="sportsbook"></div><script src="../sidebar.js"></script>
<div class="main-content"><header class="main-header"><h1 id="mappingPageTitle">Tournament Mapping</h1><p id="mappingPageSubtitle" class="page-subtitle">Manage provider tournament mappings.</p></header>
<main class="mapping-workspace tournament-manage-page">
<a id="mappingBackLink" href="tournament.html?view=provider" class="entity-mapping-back">&larr; Back to Provider tournaments</a>
<div id="mappingMessage" class="mapping-message" role="status" hidden></div>
<section id="mappingDetails" class="mapping-card tournament-manage-card" hidden>
<div class="tournament-map-section-heading"><h2>Current mapping</h2></div>
<div id="tournamentCategoryGate" hidden role="status" style="margin:24px 28px 0;padding:18px;border:1px solid #efd8a9;border-radius:8px;background:#fffaf0;color:#795a26;font-size:14px;line-height:1.6"></div>
<div class="tournament-map-summary">
<section class="tournament-map-source"><span class="tournament-map-caption">Provider tournament</span><h2 id="mappingDetailTitle"></h2><div id="mappingDetailSource" class="tournament-map-meta"></div></section>
<span class="tournament-map-arrow" aria-hidden="true">&rarr;</span>
<section id="mappingCurrent" class="tournament-map-current"></section>
</div>
<section id="mappingHistory" class="mapping-history-section tournament-map-history"></section>
</section>
</main></div>
<div id="mappingActionModal" class="modal mapping-dialog tournament-confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="mappingActionTitle"><div class="modal-content"><button type="button" id="closeMappingAction" class="close-modal" aria-label="Close" style="border:0;background:transparent;padding:0;">&times;</button><h3 id="mappingActionTitle"></h3><p id="mappingActionDescription"></p><div id="mappingActionSource" class="mapping-action-source"></div><div id="mappingTargetField" class="master-target-picker">
<div class="mapping-picker-toolbar"><label for="mappingTargetSearch" class="master-target-search-label">Search tournaments</label><button type="button" id="createTournamentFromProvider" class="btn-secondary mapping-create-shortcut">+ Create tournament</button></div>
<input type="search" id="mappingTargetSearch" placeholder="Search by name or ID..." autocomplete="off">
<div class="master-target-list-heading"><strong>Tournaments</strong><span id="mappingTargetCount" aria-live="polite"></span></div>
<fieldset id="mappingTargetList" class="master-target-list" aria-label="Choose a tournament"></fieldset>
<input type="hidden" id="mappingTarget"><div id="mappingTargetSelection" class="master-target-selection" role="status"></div>
</div><div id="mappingConfirmation" class="tournament-mapping-confirmation" hidden></div><div id="mappingActionError" class="mapping-message error" role="alert" hidden></div><div class="modal-actions"><button type="button" id="backMappingAction" class="btn-secondary mapping-review-back" hidden>&larr; Back</button><button type="button" id="cancelMappingAction" class="btn-secondary">Cancel</button><button type="button" id="confirmMappingAction" class="btn-primary">Confirm</button></div></div></div>
<script src="../categories/category_mapping_model.js"></script>
    <script src="tournament_mapping_model.js"></script><script src="tournament_source_creation.js"></script><script src="../sports/mapping_target_picker.js"></script><script src="tournament_mapping_demo.js"></script></body></html>
