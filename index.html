<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hermes Back Office</title>
    <link rel="stylesheet" href="style.css">
    <script src="auth.js"></script>
</head>
<body class="service-select-body">
    <main class="service-select-shell">
        <section class="service-select-panel" aria-labelledby="serviceSelectTitle">
            <h1 id="serviceSelectTitle">Welcome to Hermes Back Office!</h1>
            <p class="service-select-subtitle">Your central hub for managing operations efficiently. Access your tools, monitor key insights, and stay in control - all in one place.</p>

            <section class="service-section" aria-label="Multifeed">
                <div class="service-option-grid service-option-grid-single">
                    <a class="service-option" href="multifeed/messages/messages.html" aria-label="Open Multifeed">
                        <span class="service-option-icon" aria-hidden="true"></span>
                        <span class="service-option-copy">
                            <strong>Multifeed</strong>
                            <span>Feed Provider Aggregator</span>
                        </span>
                        <span class="service-option-arrow" aria-hidden="true">&rarr;</span>
                    </a>
                </div>
            </section>
        </section>
    </main>
</body>
</html>
