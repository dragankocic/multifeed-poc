<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link rel="stylesheet" href="../style.css">
    <script src="../auth.js"></script>
    <style>
        .page-title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .consumer-feeds {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .feed-chip {
            display: inline-flex;
            align-items: center;
            padding: 4px 8px;
            border-radius: 999px;
            background: #eef9fb;
            color: #0c5460;
            font-size: 12px;
            font-weight: 700;
        }

        .consumer-modal {
            width: min(760px, 92vw);
        }

        .consumer-form {
            display: grid;
            gap: 18px;
        }

        .consumer-form input {
            width: 100%;
            min-width: 0 !important;
            height: 42px;
            box-sizing: border-box;
        }

        .feed-selection-grid {
            display: grid;
            gap: 10px;
            max-height: 360px;
            overflow: auto;
            padding-right: 4px;
        }

        .feed-option {
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border: 1px solid #e1e5ea;
            border-radius: 8px;
            background: #f8f9fa;
        }

        .feed-option input {
            width: auto;
            height: auto;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 18px;
        }

        @media (max-width: 760px) {
            .page-title-row {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div id="sidebar-container" data-root=".." data-active="consumers"></div>
    <script src="../sidebar.js"></script>

    <div class="main-content">
        <header class="main-header">
            <div class="page-title-row">
                <div>
                    <h1>Settings</h1>
                    <p class="page-subtitle">Configure feed providers and outgoing consumers.</p>
                </div>
                <button type="button" id="openCreateConsumerBtn" class="btn-primary">Create</button>
            </div>
        </header>

        <main class="split-layout">
            <div class="form-side">
                <nav class="settings-tabs" aria-label="Settings sections">
                    <a href="feed_providers.html" class="settings-tab">Feed Providers</a>
                    <a href="consumers.html" class="settings-tab active">Consumers</a>
                </nav>
                <section class="markets-section">
                    <table class="markets-table">
                        <thead>
                            <tr>
                                <th>Consumer Name</th>
                                <th>Type</th>
                                <th>Feeds</th>
                                <th>Number of Feeds</th>
                                <th style="text-align: right;">Action</th>
                            </tr>
                        </thead>
                        <tbody id="consumersTableBody"></tbody>
                    </table>
                </section>
            </div>
        </main>
    </div>

    <div id="consumerModal" class="modal">
        <div class="modal-content consumer-modal">
            <span class="close-modal" id="closeConsumerModalBtn">&times;</span>
            <h3 id="consumerModalTitle">Create Consumer</h3>
            <div class="consumer-form">
                <div class="form-group">
                    <label for="consumerNameInput">Consumer Name</label>
                    <input id="consumerNameInput" type="text" placeholder="Consumer name">
                </div>
                <div>
                    <label>Feeds</label>
                    <div class="feed-selection-grid" id="feedSelectionGrid">
                        <label class="feed-option">
                            <input type="checkbox" value="SportRadar - Feed 1" checked>
                            <span><strong>SportRadar - Feed 1</strong><br><span style="color: #666;">12 groups</span></span>
                            <span class="status-badge status-mapped">Up</span>
                        </label>
                        <label class="feed-option">
                            <input type="checkbox" value="SportRadar - Feed 2">
                            <span><strong>SportRadar - Feed 2</strong><br><span style="color: #666;">4 groups</span></span>
                            <span class="status-badge status-unmapped">Error</span>
                        </label>
                        <label class="feed-option">
                            <input type="checkbox" value="ExeFeed - Feed 1" checked>
                            <span><strong>ExeFeed - Feed 1</strong><br><span style="color: #666;">8 groups</span></span>
                            <span class="status-badge status-mapped">Up</span>
                        </label>
                    </div>
                </div>
            </div>
            <p id="consumerSaveError" class="form-feedback" role="alert" hidden></p>
            <div class="modal-actions">
                <button type="button" id="cancelConsumerBtn" class="btn-secondary">Cancel</button>
                <button type="button" id="saveConsumerBtn" class="btn-primary">Create consumer</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const consumerModal = document.getElementById('consumerModal');
            const consumerModalTitle = document.getElementById('consumerModalTitle');
            const consumerNameInput = document.getElementById('consumerNameInput');
            const saveConsumerBtn = document.getElementById('saveConsumerBtn');
            const consumersTableBody = document.getElementById('consumersTableBody');
            let feedCheckboxes = [...document.querySelectorAll('#feedSelectionGrid input[type="checkbox"]')];
            let consumers = [
                { id: 'consumer-1', name: 'Consumer 1', type: 'Kafka', feeds: ['SportRadar - Feed 1', 'ExeFeed - Feed 1'] },
                { id: 'consumer-2', name: 'Consumer 2', type: 'Kafka', feeds: ['SportRadar - Feed 2'] }
            ];
            const escape = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
            const storageKey='multifeed:consumers:v1';
            try { const saved=localStorage.getItem(storageKey);if(saved){const parsed=JSON.parse(saved);if(!Array.isArray(parsed)||parsed.some(item=>typeof item.name!=='string'||!Array.isArray(item.feeds)))throw Error();consumers=parsed;} }
            catch { saveConsumerBtn.disabled=true; }
            function refreshFeedChoices(){
                const saved=localStorage.getItem('multifeed:provider-settings:v1');
                if(!saved)return;
                const providers=JSON.parse(saved);
                document.getElementById('feedSelectionGrid').innerHTML=Object.entries(providers).flatMap(([provider,feeds])=>feeds.map(feed=>{const label=provider+' - '+feed.name;return `<label class="feed-option"><input type="checkbox" value="${escape(label)}"><span>${escape(label)}</span></label>`;})).join('');
                feedCheckboxes=[...document.querySelectorAll('#feedSelectionGrid input[type="checkbox"]')];
            }
            let currentMode = 'create';
            let editingConsumerId = null;

            function renderConsumers() {
                consumersTableBody.innerHTML = consumers.map(consumer => `
                    <tr>
                        <td class="market-name">${escape(consumer.name)}</td>
                        <td>${consumer.type}</td>
                        <td>
                            <div class="consumer-feeds">
                                ${consumer.feeds.map(feed => `<span class="feed-chip">${escape(feed)}</span>`).join('')}
                            </div>
                        </td>
                        <td>${consumer.feeds.length}</td>
                        <td style="text-align: right;"><button type="button" class="btn-action edit-consumer-btn" data-id="${consumer.id}">Edit</button></td>
                    </tr>
                `).join('');
                document.querySelectorAll('.edit-consumer-btn').forEach(button => {
                    button.addEventListener('click', () => {
                        const consumer = consumers.find(item => item.id === button.dataset.id);
                        if (consumer) openConsumerModal('edit', consumer);
                    });
                });
            }

            function selectedFeeds() {
                return feedCheckboxes
                    .filter(checkbox => checkbox.checked)
                    .map(checkbox => checkbox.value);
            }

            function setSelectedFeeds(feeds) {
                feedCheckboxes.forEach(checkbox => {
                    checkbox.checked = feeds.includes(checkbox.value);
                });
            }

            function openConsumerModal(mode, consumer = null) {
                let readError='';try { refreshFeedChoices(); } catch { readError='Feed choices could not be read. Reload and try again.'; }
                const error=document.getElementById('consumerSaveError');error.hidden=!readError&&!saveConsumerBtn.disabled;
                error.textContent=readError||'Saved consumer settings could not be read. Reload after restoring the saved data.';
                if(readError)saveConsumerBtn.disabled=true;
                currentMode = mode;
                editingConsumerId = consumer?.id || null;
                consumerModalTitle.textContent = mode === 'edit' ? 'Edit Consumer' : 'Create Consumer';
                consumerNameInput.value = consumer?.name || '';
                setSelectedFeeds(consumer?.feeds || ['SportRadar - Feed 1', 'ExeFeed - Feed 1']);
                saveConsumerBtn.textContent = mode === 'edit' ? 'Save changes' : 'Create consumer';
                consumerModal.style.display = 'flex';
            }

            document.getElementById('openCreateConsumerBtn').addEventListener('click', () => openConsumerModal('create'));
            saveConsumerBtn.addEventListener('click', () => {
                const name = consumerNameInput.value.trim();
                const error=document.getElementById('consumerSaveError');
                try {
                    if(!name)throw Error('Enter a consumer name.');
                    const fresh=JSON.parse(localStorage.getItem(storageKey)||'null')||consumers;
                    if(fresh.some(consumer=>consumer.id!==editingConsumerId&&consumer.name.toLowerCase()===name.toLowerCase()))throw Error('A consumer with this name already exists.');
                    const feeds=selectedFeeds();
                    if(!feeds.length)throw Error('Select at least one feed.');
                    const providerData=JSON.parse(localStorage.getItem('multifeed:provider-settings:v1')||'null');
                    if(providerData){const available=Object.entries(providerData).flatMap(([provider,rows])=>rows.map(row=>provider+' - '+row.name));if(feeds.some(feed=>!available.includes(feed)))throw Error('Selected feeds changed. Close and reopen this window.');}
                    if(currentMode==='edit'&&JSON.stringify(fresh.find(item=>item.id===editingConsumerId))!==JSON.stringify(consumers.find(item=>item.id===editingConsumerId)))throw Error('This consumer changed. Reload and review it before saving.');
                    const next=fresh.map(consumer=>({...consumer}));
                    if(currentMode==='edit'){
                        const consumer=next.find(item=>item.id===editingConsumerId);
                        if(!consumer)throw Error('This consumer no longer exists.');
                        consumer.name=name;consumer.feeds=feeds;
                    }else next.push({id:'consumer-'+Date.now(),name,type:'Kafka',feeds});
                    localStorage.setItem(storageKey,JSON.stringify(next));consumers=next;
                }catch(problem){error.textContent=problem.message;error.hidden=false;return;}
                consumerModal.style.display = 'none';
                renderConsumers();
            });
            document.getElementById('closeConsumerModalBtn').addEventListener('click', () => {
                consumerModal.style.display = 'none';
            });
            document.getElementById('cancelConsumerBtn').addEventListener('click', () => {
                consumerModal.style.display = 'none';
            });
            window.addEventListener('click', event => {
                if (event.target === consumerModal) {
                    consumerModal.style.display = 'none';
                }
            });

            renderConsumers();
        });
    </script>
</body>
</html>
