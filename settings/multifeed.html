<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multifeed Settings</title>
    <link rel="stylesheet" href="../style.css">
    <script src="../auth.js"></script>
    <style>
        .settings-grid {
            display: grid;
            grid-template-columns: minmax(280px, 0.9fr) minmax(360px, 1.1fr);
            gap: 20px;
        }

        .settings-card {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .settings-form {
            display: grid;
            gap: 16px;
        }

        .settings-form .form-group {
            margin: 0;
        }

        .settings-form select,
        .settings-form input {
            width: 100%;
            min-width: 0 !important;
            height: 42px;
            box-sizing: border-box;
        }

        .setting-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .setting-row:last-child {
            border-bottom: 0;
        }

        @media (max-width: 980px) {
            .settings-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="sidebar-container" data-root=".." data-active="multifeed-settings"></div>
    <script src="../sidebar.js"></script>

    <div class="main-content">
        <header class="main-header">
            <h1>Multifeed Settings</h1>
            <p class="page-subtitle">Configure multifeed behavior and the default leading feed provider.</p>
        </header>

        <main class="split-layout">
            <div class="form-side">
                <div class="settings-grid">
                    <section class="settings-card">
                        <h2 style="margin: 0 0 18px;">General</h2>
                        <div class="settings-form">
                            <div class="form-group">
                                <label for="leadingFeedSelect">Leading Feed Provider</label>
                                <select id="leadingFeedSelect">
                                    <option selected>SportRadar</option>
                                    <option>ExeFeed</option>
                                    <option>Bet Genius</option>
                                </select>
                            </div>
                        </div>
                    </section>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
