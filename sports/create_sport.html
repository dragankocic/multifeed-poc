<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Sport</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../style.css">
    <script src="../auth.js"></script>
</head>
<body>

    <div id="sidebar-container" data-root=".." data-active="sports-management" data-service="sportsbook"></div>
    <script src="../sidebar.js"></script>

    <div class="main-content">
        <header class="main-header" style="background-color: #17a2b8;">
            <h1 id="pageMainTitle">Create Sport</h1>
            <p class="page-subtitle">Create or update a sport name, abbreviation, and leading feed provider override.</p>
        </header>

        <main class="split-layout">
            <div class="form-side">
                
                <div style="margin-bottom: 20px;">
                    <a href="hermes_sports.html" class="btn-secondary" style="text-decoration: none; display: inline-block;">&larr; Back to list</a>
                </div>

                <div class="info-section">
                    <h2 id="pageSubTitle">Define a new Sport</h2>
                </div>

                <section class="section-card">
                    <h3 class="section-title">Sport Details</h3>
                    <div class="form-column">
                        
                        <div class="form-group">
                            <label for="sportName">Sport Name</label>
                            <input type="text" id="sportName" placeholder="e.g. Volleyball">
                        </div>

                        <div class="form-group">
                            <label for="sportAbbr">Abbreviation</label>
                            <input type="text" id="sportAbbr" placeholder="e.g. VLB" maxlength="3" style="text-transform: uppercase;">
                        </div>

                        <div class="form-group">
                            <label for="leadingFeedSelect">Leading Feed Provider</label>
                            <select id="leadingFeedSelect">
                                <option value="Inherited from Multifeed" selected>Inherited from Multifeed</option>
                                <option value="SportRadar">SportRadar</option>
                                <option value="ExeFeed">ExeFeed</option>
                                <option value="Bet Genius">Bet Genius</option>
                            </select>
                        </div>

                    </div>
                </section>

                <div class="actions-bar">
                    <button id="saveSportBtn" class="btn-primary">Save sport</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Provera URL parametara za Edit mod
            const urlParams = new URLSearchParams(window.location.search);
            const isEdit = urlParams.get('edit') === 'true';
            const editName = urlParams.get('name');
            const editAbbr = urlParams.get('abbr');
            const editLeadingFeed = urlParams.get('leadingFeed');

            // Ako je Edit mod, popuni polja i promeni naslove
            if (isEdit) {
                document.getElementById('pageMainTitle').textContent = 'Edit Sport';
                document.getElementById('pageSubTitle').textContent = 'Update existing Sport';
                document.getElementById('saveSportBtn').textContent = 'Update sport';
                document.title = 'Edit Sport';

                if (editName) document.getElementById('sportName').value = editName;
                if (editAbbr) document.getElementById('sportAbbr').value = editAbbr;
                if (editLeadingFeed) document.getElementById('leadingFeedSelect').value = editLeadingFeed;
            }

            // Logika za čuvanje
            document.getElementById('saveSportBtn').addEventListener('click', () => {
                const name = document.getElementById('sportName').value;
                const abbr = document.getElementById('sportAbbr').value;
                const leadingFeed = document.getElementById('leadingFeedSelect').value;
                
                if(!name || !abbr || !leadingFeed) {
                    alert("Please fill in all fields.");
                    return;
                }

                const actionText = isEdit ? "updated" : "created";
                alert(`Sport "${name}" (${abbr.toUpperCase()}) successfully ${actionText}!`);
                window.location.href = 'hermes_sports.html';
            });
        });
    </script>
</body>
</html>
