<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Mappings Dashboard</title>
    <link rel="stylesheet" href="../style.css">
    <script src="../auth.js"></script>
</head>
<body>

    <div id="sidebar-container" data-root=".." data-active="sports-mapping" data-service="sportsbook"></div>
    <script src="../sidebar.js"></script>

    <div class="main-content">
        <header class="main-header">
            <h1>Sport Mapping</h1>
            <p class="page-subtitle">Track and maintain mappings between provider sports and internal sports.</p>
        </header>

        <main class="split-layout">
            <div class="form-side">
                <div class="top-bar">
                    <div class="filters">
                        <div class="filter-group">
                            <label for="providerSelect">Provider</label>
                            <select id="providerSelect">
                                <option value="ExeFeed" selected>ExeFeed</option>
                                <option value="SportRadar">SportRadar</option>
                                <option value="SportGenius">SportGenius</option>
                            </select>
                        </div>

                        <div class="filter-group">
                            <label for="statusSelect">Mapping status</label>
                            <select id="statusSelect">
                                <option value="all" selected>All</option>
                                <option value="mapped">Mapped</option>
                                <option value="unmapped">Unmapped</option>
                            </select>
                        </div>

                        <div class="filter-group">
                            <label for="searchInput">Search</label>
                            <input type="text" id="searchInput" placeholder="Search sport..." style="padding: 10px 15px; border: 1px solid #ccc; border-radius: 4px; font-size: 15px; min-width: 200px; background-color: #fdfdfd;">
                        </div>
                    </div>
                </div>

                <section class="markets-section" style="overflow-x: auto;">
                    <table class="markets-table" style="min-width: 1000px;">
                        <thead>
                            <tr>
                                <th>Provider</th>
                                <th>Prov. Sport ID</th>
                                <th>Prov. Sport Name</th>
                                <th>Internal Sport ID</th>
                                <th>Internal Sport Name</th>
                                <th>Internal Abbr.</th>
                                <th>Status</th>
                                <th style="text-align: right;">Action</th>
                            </tr>
                        </thead>
                        <tbody id="sportsTableBody">
                            </tbody>
                    </table>
                </section>
            </div>
        </main>
    </div>

    <script src="../pagination.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const tableBody = document.getElementById("sportsTableBody");
            const providerSelect = document.getElementById("providerSelect");
            const statusSelect = document.getElementById("statusSelect");
            const searchInput = document.getElementById("searchInput");

            // Mock podaci za provider sportove
            const providerSports = [
                { provider: "ExeFeed", provId: "F", provName: "Fudbal", internalId: "S-001", internalName: "Soccer", internalAbbr: "SOC", status: "Mapped" },
                { provider: "SportRadar", provId: "sr:sport:1", provName: "Football", internalId: "S-001", internalName: "Soccer", internalAbbr: "SOC", status: "Mapped" },
                { provider: "ExeFeed", provId: "B", provName: "Košarka", internalId: "S-002", internalName: "Basketball", internalAbbr: "BKB", status: "Mapped" },
                { provider: "SportGenius", provId: "sg-10", provName: "Ice Hockey", internalId: "-", internalName: "-", internalAbbr: "-", status: "Unmapped" },
                { provider: "ExeFeed", provId: "T", provName: "Tenis", internalId: "S-003", internalName: "Tennis", internalAbbr: "TEN", status: "Mapped" },
                { provider: "ExeFeed", provId: "IH", provName: "Hokej na ledu", internalId: "-", internalName: "-", internalAbbr: "-", status: "Unmapped" },
                { provider: "ExeFeed", provId: "V", provName: "Odbojka", internalId: "-", internalName: "-", internalAbbr: "-", status: "Unmapped" },
                { provider: "ExeFeed", provId: "H", provName: "Rukomet", internalId: "-", internalName: "-", internalAbbr: "-", status: "Unmapped" }
            ];

            function renderSports() {
                tableBody.innerHTML = ""; 

                const providerVal = providerSelect.value;
                const statusVal = statusSelect.value;
                const searchVal = searchInput.value.toLowerCase();

                // Logika za filtriranje
                const filteredSports = providerSports.filter(sport => {
                    const matchesProvider = sport.provider === providerVal;
                    const matchesStatus = statusVal === 'all' || sport.status.toLowerCase() === statusVal;
                    
                    // Pretraga po nazivu provider sporta ili internog sporta
                    const matchesSearch = sport.provId.toLowerCase().includes(searchVal) ||
                                          sport.provName.toLowerCase().includes(searchVal) || 
                                          sport.internalName.toLowerCase().includes(searchVal);

                    return matchesProvider && matchesStatus && matchesSearch;
                });

                // Ako filteri ne vrate nijedan podatak
                if (filteredSports.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="8" style="text-align: center; color: #888; font-style: italic; padding: 20px;">No sports found matching the filters.</td></tr>';
                    return;
                }

                filteredSports.forEach(sport => {
                    const row = document.createElement("tr");

                    const badgeStyle = sport.status === "Mapped"
                        ? "background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb;"
                        : "background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba;";

                    // Menjamo tekst i boju dugmeta u zavisnosti od statusa mapiranja
                    const actionButton = sport.status === "Mapped"
                        ? `<a href="map_sport.html?provider=${sport.provider}&provName=${sport.provName}&internalId=${encodeURIComponent(sport.internalId)}" class="btn-action" style="background-color: #17a2b8; text-decoration: none; display: inline-block;">Edit</a>`
                        : `<a href="map_sport.html?provider=${sport.provider}&provName=${sport.provName}" class="btn-action" style="text-decoration: none; display: inline-block;">Map</a>`;

                    row.innerHTML = `
                        <td style="font-weight: 500;">${sport.provider}</td>
                        <td style="color: #6c757d;">${sport.provId}</td>
                        <td class="market-name" style="color: #007bff;">${sport.provName}</td>
                        <td style="color: #6c757d;">${sport.internalId}</td>
                        <td style="font-weight: 500;">${sport.internalName}</td>
                        <td style="color: #555;">${sport.internalAbbr}</td>
                        <td>
                            <span class="status-badge" style="${badgeStyle}">${sport.status}</span>
                        </td>
                        <td style="text-align: right;">
                            ${actionButton}
                        </td>
                    `;

                    tableBody.appendChild(row);
                });
            }

            // Slušači za filtere
            providerSelect.addEventListener('change', renderSports);
            statusSelect.addEventListener('change', renderSports);
            searchInput.addEventListener('input', renderSports);

            // Prvo renderovanje tabele
            renderSports();
        });
    </script>
</body>
</html>
