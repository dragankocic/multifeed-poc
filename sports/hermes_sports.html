<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Management</title>
    <link rel="stylesheet" href="../style.css">
    <script src="../auth.js"></script>
    <style>
        .workspace-tabs {
            display: inline-flex;
            gap: 4px;
            padding: 4px;
            background: #eef3f4;
            border: 1px solid #d4dee1;
            border-radius: 6px;
        }

        .workspace-tab {
            border: 0;
            border-radius: 4px;
            padding: 9px 14px;
            background: transparent;
            color: #566;
            font-weight: 700;
            cursor: pointer;
        }

        .workspace-tab.active {
            background: #17a2b8;
            color: white;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
        }

        .row-actions {
            display: inline-flex;
            justify-content: flex-end;
            gap: 6px;
            white-space: nowrap;
        }

        .workspace-toolbar .filters {
            display: grid;
            grid-template-columns: minmax(260px, 340px) minmax(180px, 220px) minmax(210px, 250px) minmax(260px, 1fr);
            align-items: flex-end;
            gap: 16px;
            flex: 1;
        }

        .workspace-toolbar .filter-group {
            min-height: 66px;
            justify-content: flex-end;
        }

        .workspace-toolbar select,
        .workspace-toolbar input {
            width: 100%;
            height: 41px;
            min-width: 0 !important;
            box-sizing: border-box;
        }

        .workspace-toolbar .actions {
            display: flex;
            align-items: flex-end;
            min-height: 66px;
            flex-shrink: 0;
        }

        .workspace-toolbar .btn-primary {
            height: 41px;
            display: inline-flex !important;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
        }

        @media (max-width: 1300px) {
            .workspace-toolbar {
                align-items: stretch;
                gap: 16px;
            }

            .workspace-toolbar .filters {
                grid-template-columns: repeat(2, minmax(220px, 1fr));
            }
        }

        @media (max-width: 760px) {
            .workspace-toolbar {
                flex-direction: column;
            }

            .workspace-toolbar .filters {
                grid-template-columns: 1fr;
            }

            .workspace-tabs,
            .workspace-toolbar .actions,
            .workspace-toolbar .btn-primary {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div id="sidebar-container" data-root=".." data-active="sports-management"></div>
    <script src="../sidebar.js"></script>

    <div class="main-content">
        <header class="main-header" style="background-color: #17a2b8;">
            <h1>Sports Management</h1>
            <p class="page-subtitle">Create, inspect, and map sports from either the internal or provider perspective.</p>
        </header>

        <main class="split-layout">
            <div class="form-side">
                <div class="top-bar workspace-toolbar">
                    <div class="filters">
                        <div class="filter-group">
                            <label>View</label>
                            <div class="workspace-tabs" aria-label="Sport mapping perspective">
                                <button type="button" class="workspace-tab active" data-view="internal">Internal sports</button>
                                <button type="button" class="workspace-tab" data-view="provider">Provider sports</button>
                            </div>
                        </div>

                        <div class="filter-group" id="providerFilterGroup" style="display: none;">
                            <label for="providerSelect">Provider</label>
                            <select id="providerSelect">
                                <option value="all" selected>All</option>
                                <option value="ExeFeed">ExeFeed</option>
                                <option value="SportRadar">SportRadar</option>
                                <option value="SportGenius">SportGenius</option>
                            </select>
                        </div>

                        <div class="filter-group" id="statusFilterGroup" style="display: none;">
                            <label for="statusSelect">Mapping status</label>
                            <select id="statusSelect">
                                <option value="all" selected>All</option>
                                <option value="mapped">Mapped</option>
                                <option value="unmapped">Unmapped</option>
                            </select>
                        </div>

                        <div class="filter-group">
                            <label for="searchInput">Search</label>
                            <input type="text" id="searchInput" placeholder="Search sport..." style="padding: 10px 15px; border: 1px solid #ccc; border-radius: 4px; font-size: 15px; min-width: 230px; background-color: #fdfdfd;">
                        </div>
                    </div>

                    <div class="actions">
                        <a href="create_sport.html" class="btn-primary" style="text-decoration: none; display: inline-block;">Create Sport</a>
                    </div>
                </div>

                <section class="markets-section" style="overflow-x: auto;">
                    <table class="markets-table" id="workspaceTable" style="min-width: 980px;">
                        <thead id="workspaceHead"></thead>
                        <tbody id="workspaceBody"></tbody>
                    </table>
                </section>
            </div>
        </main>
    </div>

    <script src="../pagination.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const internalSports = [
                { id: "S-001", name: "Soccer", abbr: "SOC" },
                { id: "S-002", name: "Basketball", abbr: "BKB" },
                { id: "S-003", name: "Tennis", abbr: "TEN" },
                { id: "S-004", name: "Ice Hockey", abbr: "IHO" },
                { id: "S-005", name: "Baseball", abbr: "BBS" }
            ];

            const providerSports = [
                { provider: "ExeFeed", provId: "F", provName: "Fudbal", internalId: "S-001", internalName: "Soccer", internalAbbr: "SOC", status: "Mapped" },
                { provider: "SportRadar", provId: "sr:sport:1", provName: "Football", internalId: "S-001", internalName: "Soccer", internalAbbr: "SOC", status: "Mapped" },
                { provider: "ExeFeed", provId: "B", provName: "Košarka", internalId: "S-002", internalName: "Basketball", internalAbbr: "BKB", status: "Mapped" },
                { provider: "ExeFeed", provId: "T", provName: "Tenis", internalId: "S-003", internalName: "Tennis", internalAbbr: "TEN", status: "Mapped" },
                { provider: "SportGenius", provId: "sg-10", provName: "Ice Hockey", internalId: "-", internalName: "-", internalAbbr: "-", status: "Unmapped" },
                { provider: "ExeFeed", provId: "IH", provName: "Hokej na ledu", internalId: "-", internalName: "-", internalAbbr: "-", status: "Unmapped" },
                { provider: "ExeFeed", provId: "V", provName: "Odbojka", internalId: "-", internalName: "-", internalAbbr: "-", status: "Unmapped" },
                { provider: "ExeFeed", provId: "H", provName: "Rukomet", internalId: "-", internalName: "-", internalAbbr: "-", status: "Unmapped" }
            ];

            const tabs = document.querySelectorAll('.workspace-tab');
            const providerFilterGroup = document.getElementById('providerFilterGroup');
            const statusFilterGroup = document.getElementById('statusFilterGroup');
            const providerSelect = document.getElementById('providerSelect');
            const statusSelect = document.getElementById('statusSelect');
            const searchInput = document.getElementById('searchInput');
            const workspaceHead = document.getElementById('workspaceHead');
            const workspaceBody = document.getElementById('workspaceBody');
            let activeView = 'internal';

            function renderInternalView() {
                workspaceHead.innerHTML = `
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Abbreviation</th>
                        <th style="text-align: right;">Action</th>
                    </tr>
                `;

                const searchVal = searchInput.value.toLowerCase();
                const rows = internalSports.filter(sport => {
                    return sport.id.toLowerCase().includes(searchVal) ||
                        sport.name.toLowerCase().includes(searchVal) ||
                        sport.abbr.toLowerCase().includes(searchVal);
                });

                if (rows.length === 0) {
                    workspaceBody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #888; font-style: italic; padding: 20px;">No sports found.</td></tr>';
                    return;
                }

                workspaceBody.innerHTML = rows.map(sport => {
                    return `
                        <tr>
                            <td style="font-weight: 500; color: #6c757d;">${sport.id}</td>
                            <td class="market-name">${sport.name}</td>
                            <td><span style="background: #e9ecef; padding: 4px 10px; border-radius: 4px; font-size: 13px; font-weight: 600; border: 1px solid #ccc;">${sport.abbr}</span></td>
                            <td style="text-align: right;">
                                <span class="row-actions">
                                    <a href="view_hermes_sport.html?id=${encodeURIComponent(sport.id)}&name=${encodeURIComponent(sport.name)}&abbr=${encodeURIComponent(sport.abbr)}" class="btn-action" style="background-color: #007bff; text-decoration: none; display: inline-block;">View</a>
                                    <a href="create_sport.html?edit=true&name=${encodeURIComponent(sport.name)}&abbr=${encodeURIComponent(sport.abbr)}" class="btn-action" style="background-color: #17a2b8; text-decoration: none; display: inline-block;">Edit</a>
                                </span>
                            </td>
                        </tr>
                    `;
                }).join('');
            }

            function renderProviderView() {
                workspaceHead.innerHTML = `
                    <tr>
                        <th>Provider</th>
                        <th>Provider Sport ID</th>
                        <th>Provider Sport Name</th>
                        <th>Internal Sport ID</th>
                        <th>Internal Sport Name</th>
                        <th>Internal Abbr.</th>
                        <th>Status</th>
                        <th style="text-align: right;">Action</th>
                    </tr>
                `;

                const providerVal = providerSelect.value;
                const statusVal = statusSelect.value;
                const searchVal = searchInput.value.toLowerCase();
                const rows = providerSports.filter(sport => {
                    const matchesProvider = providerVal === 'all' || sport.provider === providerVal;
                    const matchesStatus = statusVal === 'all' || sport.status.toLowerCase() === statusVal;
                    const matchesSearch = sport.provider.toLowerCase().includes(searchVal) ||
                        sport.provId.toLowerCase().includes(searchVal) ||
                        sport.provName.toLowerCase().includes(searchVal) ||
                        sport.internalName.toLowerCase().includes(searchVal);
                    return matchesProvider && matchesStatus && matchesSearch;
                });

                if (rows.length === 0) {
                    workspaceBody.innerHTML = '<tr><td colspan="8" style="text-align: center; color: #888; font-style: italic; padding: 20px;">No provider sports found.</td></tr>';
                    return;
                }

                workspaceBody.innerHTML = rows.map(sport => {
                    const badgeClass = sport.status === 'Mapped' ? 'status-mapped' : 'status-unmapped';
                    const actionHref = sport.status === 'Mapped'
                        ? `map_sport.html?provider=${encodeURIComponent(sport.provider)}&provName=${encodeURIComponent(sport.provName)}&internalId=${encodeURIComponent(sport.internalId)}`
                        : `map_sport.html?provider=${encodeURIComponent(sport.provider)}&provName=${encodeURIComponent(sport.provName)}`;
                    const actionLabel = sport.status === 'Mapped' ? 'Edit mapping' : 'Map';
                    return `
                        <tr>
                            <td style="font-weight: 500;">${sport.provider}</td>
                            <td style="color: #6c757d;">${sport.provId}</td>
                            <td class="market-name" style="color: #007bff;">${sport.provName}</td>
                            <td style="color: #6c757d;">${sport.internalId}</td>
                            <td style="font-weight: 500;">${sport.internalName}</td>
                            <td style="color: #555;">${sport.internalAbbr}</td>
                            <td><span class="status-badge ${badgeClass}">${sport.status}</span></td>
                            <td style="text-align: right;">
                                <span class="row-actions">
                                    <a href="${actionHref}" class="btn-action" style="text-decoration: none; display: inline-block;">${actionLabel}</a>
                                </span>
                            </td>
                        </tr>
                    `;
                }).join('');
            }

            function render() {
                providerFilterGroup.style.display = activeView === 'provider' ? 'block' : 'none';
                statusFilterGroup.style.display = activeView === 'provider' ? 'block' : 'none';
                if (activeView === 'internal') {
                    renderInternalView();
                } else {
                    renderProviderView();
                }
            }

            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    activeView = tab.dataset.view;
                    tabs.forEach(item => item.classList.toggle('active', item === tab));
                    searchInput.value = '';
                    render();
                });
            });

            providerSelect.addEventListener('change', render);
            statusSelect.addEventListener('change', render);
            searchInput.addEventListener('input', render);

            render();
        });
    </script>
</body>
</html>
