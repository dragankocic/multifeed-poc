<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sport Mapping</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="sport_mapping_demo.css"><script src="../auth.js"></script></head>
<body><div id="sidebar-container" data-root=".." data-active="sports-mapping" data-service="sportsbook"></div><script src="../sidebar.js"></script>
<div class="main-content"><header class="main-header"><h1 id="mappingPageTitle">Sport Mapping</h1><p id="mappingPageSubtitle" class="page-subtitle">Prepare, activate and maintain provider sport mappings.</p></header>
<main class="mapping-workspace">
<a id="mappingBackLink" href="hermes_sports.html?view=provider" class="btn-secondary" style="display:inline-block;margin-bottom:18px;text-decoration:none;">&larr; Back to Provider sports</a>
<div id="mappingMessage" class="mapping-message" role="status" hidden></div>
<section id="mappingDetails" class="mapping-card" hidden><div class="mapping-card-header"><div><h2 id="mappingDetailTitle"></h2><div id="mappingDetailSource" class="mapping-subtext"></div></div><div id="mappingDetailBadges" class="mapping-badges"></div></div><div class="mapping-card-body"><div class="mapping-state-grid"><section id="mappingCurrent" class="mapping-state-card"></section><section id="mappingDraft" class="mapping-state-card"></section></div><section id="mappingHistory" class="mapping-history-section"></section></div></section>
</main></div>
<div id="mappingActionModal" class="modal mapping-dialog"><div class="modal-content"><button type="button" id="closeMappingAction" class="close-modal" aria-label="Close" style="border:0;background:transparent;padding:0;">&times;</button><h3 id="mappingActionTitle"></h3><p id="mappingActionDescription"></p><div id="mappingTargetField"><label for="mappingTarget">Internal sport</label><select id="mappingTarget"></select></div><div id="mappingActionError" class="mapping-message error" role="alert" hidden></div><div class="modal-actions"><button type="button" id="cancelMappingAction" class="btn-secondary">Cancel</button><button type="button" id="confirmMappingAction" class="btn-primary">Confirm</button></div></div></div>
<script src="sport_mapping_model.js"></script><script src="sport_mapping_demo.js"></script></body></html>
