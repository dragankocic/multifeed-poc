<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sport Mapping</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="sport_mapping_demo.css"><script src="../auth.js"></script><link rel="stylesheet" href="../mapping_workspace.css"></head>
<body class="sport-mapping-page entity-mapping-page"><div id="sidebar-container" data-root=".." data-active="sports-mapping" data-service="sportsbook"></div><script src="../sidebar.js"></script>
<div class="main-content"><header class="main-header"><h1 id="mappingPageTitle">Sport Mapping</h1><p id="mappingPageSubtitle" class="page-subtitle">Manage provider sport mappings.</p></header>
<main class="mapping-workspace sport-manage-page">
<a id="mappingBackLink" href="hermes_sports.html?view=provider" class="sport-mapping-back">&larr; Back to Provider sports</a>
<div id="mappingMessage" class="mapping-message" role="status" hidden></div>
<section id="mappingDetails" class="mapping-card sport-manage-card" hidden>
<div class="sport-map-section-heading"><h2>Current mapping</h2></div>
<div class="sport-map-summary">
<section class="sport-map-source"><span class="sport-map-caption">Provider sport</span><h2 id="mappingDetailTitle"></h2><div id="mappingDetailSource" class="sport-map-meta"></div></section>
<span class="sport-map-arrow" aria-hidden="true">&rarr;</span>
<section id="mappingCurrent" class="sport-map-current"></section>
</div>
<section id="mappingHistory" class="mapping-history-section sport-map-history"></section>
</section>
</main></div>
<div id="mappingActionModal" class="modal mapping-dialog sport-confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="mappingActionTitle"><div class="modal-content"><button type="button" id="closeMappingAction" class="close-modal" aria-label="Close" style="border:0;background:transparent;padding:0;">&times;</button><h3 id="mappingActionTitle"></h3><p id="mappingActionDescription"></p><div id="mappingActionSource" class="mapping-action-source"></div><div id="mappingTargetField" class="master-target-picker">
<label for="mappingTargetSearch" class="master-target-search-label">Search sports</label>
<input type="search" id="mappingTargetSearch" placeholder="Search by name or ID..." autocomplete="off">
<div class="master-target-list-heading"><strong>Sports</strong><span id="mappingTargetCount" aria-live="polite"></span></div>
<fieldset id="mappingTargetList" class="master-target-list" aria-label="Choose a sport"></fieldset>
<input type="hidden" id="mappingTarget"><div id="mappingTargetSelection" class="master-target-selection" role="status"></div>
</div><div id="mappingConfirmation" class="sport-mapping-confirmation" hidden></div><div id="mappingActionError" class="mapping-message error" role="alert" hidden></div><div class="modal-actions"><button type="button" id="backMappingAction" class="btn-secondary mapping-review-back" hidden>&larr; Back</button><button type="button" id="cancelMappingAction" class="btn-secondary">Cancel</button><button type="button" id="confirmMappingAction" class="btn-primary">Confirm</button></div></div></div>
<script src="sport_mapping_model.js"></script><script src="mapping_target_picker.js"></script><script src="sport_mapping_demo.js"></script></body></html>
