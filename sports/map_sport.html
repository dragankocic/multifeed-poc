<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map Sport</title>
    <!-- Povlačimo globalni CSS -->
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="style.css">
    <script src="../auth.js"></script>
</head>
<body>

   <div id="sidebar-container" data-root=".." data-active="sports-mapping" data-service="sportsbook"></div>
    <script src="../sidebar.js"></script>

    <!-- GLAVNI SADRŽAJ -->
    <div class="main-content">
        <header class="main-header">
            <h1>Map Provider Sport</h1>
            <p class="page-subtitle">Connect a provider sport to the correct internal sport.</p>
        </header>

        <main class="split-layout">
            <div class="form-side">
                
                <div style="margin-bottom: 20px;">
                    <a href="sports_mapping.html" class="btn-secondary" style="text-decoration: none; display: inline-block;">&larr; Back to list</a>
                </div>

                <div class="info-section">
                    <h2>Connect to Internal Sport</h2>
                    <p class="provider-text">Provider: <strong id="displayProvider"></strong></p>
                </div>

                <section class="section-card">
                    <h3 class="section-title">Mapping Configuration</h3>
                    
                    <div class="form-row" style="align-items: flex-end; margin-bottom: 20px;">
                        
                        <!-- Leva strana (Provider Info - Readonly) -->
                        <div class="form-group" style="flex: 1; margin-bottom: 0;">
                            <label>Provider Sport Name</label>
                            <input type="text" id="displayProvName" readonly style="background-color: #f9f9f9; color: #555; font-weight: 500;">
                        </div>

                        <div style="padding: 10px; font-weight: bold; color: #888;">
                            &rarr;
                        </div>

                        <!-- Desna strana (Internal Selection) -->
                        <div class="form-group" style="flex: 1; margin-bottom: 0;">
                            <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
                                <label>Choose Internal Sport</label>
                                <a href="create_sport.html" class="btn-secondary" style="padding: 6px 10px; text-decoration: none; display: inline-block;">New</a>
                            </div>
                            <input type="text" id="internalSportSearch" placeholder="Search sports..." style="margin-bottom: 8px;">
                            <select id="internalSportSelect">
                                <option value="" disabled selected>Search sports...</option>
                                <option value="S-001">Soccer (SOC)</option>
                                <option value="S-002">Basketball (BKB)</option>
                                <option value="S-003">Tennis (TEN)</option>
                                <option value="S-004">Ice Hockey (IHO)</option>
                                <option value="S-005">Baseball (BBS)</option>
                            </select>
                        </div>

                    </div>
                </section>

                <div class="actions-bar">
                    <button id="saveMappingBtn" class="btn-primary">Save Mapping</button>
                </div>
            </div>

            <!-- Uputstvo sa desne strane -->
        </main>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Čitanje iz URL parametara
            const urlParams = new URLSearchParams(window.location.search);
            const provider = urlParams.get('provider') || 'Unknown Provider';
            const provName = urlParams.get('provName') || 'Unknown Sport';
            const internalId = urlParams.get('internalId');
            const internalSportSelect = document.getElementById('internalSportSelect');
            const internalSportSearch = document.getElementById('internalSportSearch');
            const allInternalOptions = Array.from(internalSportSelect.options).map(option => ({
                value: option.value,
                text: option.textContent,
                disabled: option.disabled,
                selected: option.selected
            }));

            // Prikaz na formi
            document.getElementById('displayProvider').textContent = provider;
            document.getElementById('displayProvName').value = provName;
            if (internalId) {
                internalSportSelect.value = internalId;
            }

            function renderInternalOptions(searchValue = '') {
                const currentValue = internalSportSelect.value;
                const normalizedSearch = searchValue.toLowerCase();
                internalSportSelect.innerHTML = '';

                allInternalOptions.forEach(optionData => {
                    if (optionData.value && !optionData.text.toLowerCase().includes(normalizedSearch)) return;

                    const option = document.createElement('option');
                    option.value = optionData.value;
                    option.textContent = optionData.text;
                    option.disabled = optionData.disabled;
                    internalSportSelect.appendChild(option);
                });

                if (Array.from(internalSportSelect.options).some(option => option.value === currentValue)) {
                    internalSportSelect.value = currentValue;
                }
            }

            internalSportSearch.addEventListener('input', () => {
                renderInternalOptions(internalSportSearch.value);
            });

            // Čuvanje mapiranja
            document.getElementById('saveMappingBtn').addEventListener('click', () => {
                if(!internalSportSelect.value) {
                    alert('Please select an internal sport before saving.');
                    return;
                }
                alert(`Mapping saved successfully! Provider "${provName}" is now mapped to an internal sport.`);
                window.location.href = 'sports_mapping.html';
            });
        });
    </script>
</body>
</html>
